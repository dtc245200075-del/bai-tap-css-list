global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  - job_name: 'wordpress' # Hoặc blackbox cho HTTP checks
    metrics_path: /metrics
    static_configs:
      - targets: ['wordpress:80'] # Nếu WordPress expose metrics (thường cần plugin hoặc exporter)

